name: Windows VST3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (MSVC, x64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset windows

      - name: Build (Release)
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: TrueAir-VST3-Windows-x64
          path: build/windows/TrueAir_artefacts/Release/VST3/
          if-no-files-found: error
